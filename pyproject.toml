[project]
name = "opeval"
version = "0.1.0"
description = "Options strategy backtester with a Streamlit UI"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "plotly>=5.24",
    "scipy>=1.13",
    "streamlit>=1.50",
    "yfinance>=0.2.60",
]

[dependency-groups]
dev = [
    "pytest>=8.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
